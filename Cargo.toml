[package]
name = "cargo-flux"
version = "0.11.5"
edition = "2024"
description = "Workspace topology and task orchestration for mixed-language repositories"
license = "MIT"
repository = "https://github.com/ignition-is-go/cargo-flux"
readme = "README.md"
keywords = ["cargo", "workspace", "monorepo", "task-runner", "polyglot"]
categories = ["development-tools::cargo-plugins", "development-tools::build-utils"]

[package.metadata.flux]
tasks = ["build", "test", "lint", "release"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
toml_edit = "0.22"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
object_store = { version = "0.14.2", default-features = false, features = ["aws", "tokio"] }
tokio = { version = "1", features = ["rt", "time", "fs", "io-util"] }
futures-util = "0.3"
zstd = { version = "0.13", features = ["zstdmt"] }

# Keep linked worktrees independent of an enclosing development workspace.
[workspace]
