name: Cargo Flux
description: Install a verified Cargo Flux binary and optionally run an affected task
author: Lucid

inputs:
  version:
    description: Cargo Flux version to install, or "action" for the version in this action release
    required: false
    default: action
  toolchain:
    description: Optional Rust toolchain to install and select
    default: ''
  components:
    description: Optional comma-separated Rust components
    default: ''
  targets:
    description: Optional comma-separated Rust targets
    default: ''
  compiler-cache:
    description: Set up sccache using the dedicated Flux S3 client
    default: 'false'
  compiler-cache-read-only:
    description: Prevent this job from writing compiler-cache entries
    default: 'false'
  compiler-cache-prefix:
    description: Object prefix for compiler outputs in the Flux bucket
    default: compiler/v1
  task:
    description: Logical task to run after installation; omit for setup-only use
    required: false
    default: ""
  affected:
    description: Optional Git base ref passed to cargo flux run --affected
    required: false
    default: ""
  root:
    description: Workspace root passed to cargo flux run --root
    required: false
    default: .
  cache:
    description: Optional task-cache environment setup; empty or s3
    default: ''
  cache-endpoint:
    description: S3-compatible endpoint for the dedicated Flux task-cache client
    default: ''
  cache-bucket:
    description: Bucket authorized for Flux task results
    default: ''
  cache-access-key-id:
    description: Dedicated Flux S3 client access key ID
    default: ''
  cache-secret-access-key:
    description: Dedicated Flux S3 client secret access key
    default: ''
  cache-session-token:
    description: Optional dedicated Flux S3 session token
    default: ''
  cache-region:
    description: S3 signing region
    default: us-east-1
  cache-required:
    description: Fail on configured cache errors when running the requested task
    default: 'false'

outputs:
  version:
    description: Installed Cargo Flux version
    value: ${{ steps.install-unix.outputs.version || steps.install-windows.outputs.version }}
  path:
    description: Absolute path to the installed cargo-flux executable
    value: ${{ steps.install-unix.outputs.path || steps.install-windows.outputs.path }}
  outcome:
    description: Requested task outcome (`completed` or `skipped`); empty in setup-only mode
    value: ${{ steps.run-unix.outputs.outcome || steps.run-windows.outputs.outcome }}
  task-outputs:
    description: Compact JSON object containing outputs from executed root tasks
    value: ${{ steps.run-unix.outputs['task-outputs'] || steps.run-windows.outputs['task-outputs'] }}

runs:
  using: composite
  steps:
    - name: Install Cargo Flux
      id: install-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        version="$REQUESTED_VERSION"
        if [[ -z "$version" || "$version" == "action" ]]; then
          version="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version[[:space:]]*=/ {
              value=$0
              sub(/^[^=]*=[[:space:]]*"/, "", value)
              sub(/".*/, "", value)
              print value
              exit
            }
          ' "$ACTION_PATH/Cargo.toml")"
        fi
        version="${version#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid Cargo Flux version: $version" >&2
          exit 1
        fi

        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64) target=x86_64-unknown-linux-gnu ;;
          macOS:ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "Cargo Flux does not publish a binary for ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        archive="cargo-flux-${version}-${target}.tgz"
        cache_dir="${RUNNER_TOOL_CACHE}/cargo-flux/${version}/${target}"
        cached_archive="${cache_dir}/${archive}"
        base="https://github.com/ignition-is-go/cargo-flux/releases/download/v${version}"
        mkdir -p "$cache_dir"

        checksum_file="$(mktemp "${RUNNER_TEMP}/cargo-flux-checksum.XXXXXX")"
        curl -fsSL "$base/$archive.sha256" -o "$checksum_file"
        expected="$(awk '{ print tolower($1) }' "$checksum_file")"
        if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
          echo "Invalid SHA-256 file for $archive" >&2
          exit 1
        fi

        hash_archive() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{ print tolower($1) }'
          else
            shasum -a 256 "$1" | awk '{ print tolower($1) }'
          fi
        }

        if [[ ! -f "$cached_archive" ]] || [[ "$(hash_archive "$cached_archive")" != "$expected" ]]; then
          pending="$(mktemp "${RUNNER_TEMP}/cargo-flux-archive.XXXXXX")"
          curl -fsSL "$base/$archive" -o "$pending"
          actual="$(hash_archive "$pending")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Checksum mismatch for $archive" >&2
            exit 1
          fi
          mv -f "$pending" "$cached_archive"
        fi

        install_dir="$(mktemp -d "${RUNNER_TEMP}/cargo-flux-${version}-${target}.XXXXXX")"
        tar -xzf "$cached_archive" -C "$install_dir"
        binary="${install_dir}/cargo-flux"
        if [[ ! -f "$binary" ]]; then
          echo "Release archive did not contain cargo-flux" >&2
          exit 1
        fi
        chmod +x "$binary"

        echo "$install_dir" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "path=$binary" >> "$GITHUB_OUTPUT"

    - name: Install Cargo Flux
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        $ErrorActionPreference = 'Stop'

        $version = $env:REQUESTED_VERSION
        if ([string]::IsNullOrWhiteSpace($version) -or $version -eq 'action') {
          $inPackage = $false
          foreach ($line in Get-Content (Join-Path $env:ACTION_PATH 'Cargo.toml')) {
            if ($line -match '^\[package\]$') {
              $inPackage = $true
              continue
            }
            if ($inPackage -and $line -match '^\[') { break }
            if ($inPackage -and $line -match '^version\s*=\s*"([^"]+)"') {
              $version = $Matches[1]
              break
            }
          }
        }
        $version = $version -replace '^v', ''
        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
          throw "Invalid Cargo Flux version: $version"
        }
        if ($env:RUNNER_ARCH -ne 'X64') {
          throw "Cargo Flux does not publish a binary for Windows/$env:RUNNER_ARCH"
        }

        $target = 'x86_64-pc-windows-msvc'
        $archive = "cargo-flux-$version-$target.tgz"
        $cacheDir = Join-Path $env:RUNNER_TOOL_CACHE "cargo-flux/$version/$target"
        $cachedArchive = Join-Path $cacheDir $archive
        $base = "https://github.com/ignition-is-go/cargo-flux/releases/download/v$version"
        New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

        $checksumPath = Join-Path $env:RUNNER_TEMP "cargo-flux-checksum-$([guid]::NewGuid()).txt"
        Invoke-WebRequest -Uri "$base/$archive.sha256" -OutFile $checksumPath
        $expected = ((Get-Content $checksumPath -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
        if ($expected -notmatch '^[0-9a-f]{64}$') {
          throw "Invalid SHA-256 file for $archive"
        }

        $cacheValid = (Test-Path $cachedArchive -PathType Leaf) -and ((Get-FileHash -Algorithm SHA256 $cachedArchive).Hash.ToLowerInvariant() -eq $expected)
        if (-not $cacheValid) {
          $pending = Join-Path $env:RUNNER_TEMP "cargo-flux-archive-$([guid]::NewGuid()).tgz"
          Invoke-WebRequest -Uri "$base/$archive" -OutFile $pending
          $actual = (Get-FileHash -Algorithm SHA256 $pending).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $archive"
          }
          Move-Item -Force $pending $cachedArchive
        }

        $installDir = Join-Path $env:RUNNER_TEMP "cargo-flux-$version-$target-$([guid]::NewGuid())"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        tar -xzf $cachedArchive -C $installDir
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $binary = Join-Path $installDir 'cargo-flux.exe'
        if (-not (Test-Path $binary -PathType Leaf)) {
          throw 'Release archive did not contain cargo-flux.exe'
        }

        $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "path=$binary" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Configure optional S3 cache environment
      shell: bash
      env:
        CACHE_MODE: ${{ inputs.cache }}
        CACHE_ENDPOINT: ${{ inputs.cache-endpoint }}
        CACHE_BUCKET: ${{ inputs.cache-bucket }}
        CACHE_ACCESS_KEY_ID: ${{ inputs.cache-access-key-id }}
        CACHE_SECRET_ACCESS_KEY: ${{ inputs.cache-secret-access-key }}
        CACHE_SESSION_TOKEN: ${{ inputs.cache-session-token }}
        CACHE_REGION: ${{ inputs.cache-region }}
        CACHE_REQUIRED: ${{ inputs.cache-required }}
      run: |
        set -euo pipefail
        case "$CACHE_REQUIRED" in true|false) ;; *) echo 'cache-required must be true or false.' >&2; exit 1 ;; esac
        if [[ -z "$CACHE_MODE" ]]; then exit 0; fi
        if [[ "$CACHE_MODE" != s3 ]]; then echo 'cache must be empty or s3.' >&2; exit 1; fi
        for name in CACHE_ENDPOINT CACHE_BUCKET CACHE_ACCESS_KEY_ID CACHE_SECRET_ACCESS_KEY CACHE_REGION; do
          value="${!name}"
          if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
            echo "$name must be a nonempty single-line value." >&2
            exit 1
          fi
        done
        if [[ "$CACHE_SESSION_TOKEN" == *$'\n'* || "$CACHE_SESSION_TOKEN" == *$'\r'* ]]; then
          echo 'CACHE_SESSION_TOKEN must be a single-line value.' >&2
          exit 1
        fi
        for name in CACHE_ACCESS_KEY_ID CACHE_SECRET_ACCESS_KEY CACHE_SESSION_TOKEN; do
          value="${!name}"
          if [[ -n "$value" ]]; then printf '::add-mask::%s\n' "${value//'%'/'%25'}"; fi
        done
        printf 'CARGO_FLUX_S3_ENDPOINT=%s\n' "$CACHE_ENDPOINT" >> "$GITHUB_ENV"
        printf 'CARGO_FLUX_S3_BUCKET=%s\n' "$CACHE_BUCKET" >> "$GITHUB_ENV"
        printf 'CARGO_FLUX_S3_ACCESS_KEY_ID=%s\n' "$CACHE_ACCESS_KEY_ID" >> "$GITHUB_ENV"
        printf 'CARGO_FLUX_S3_SECRET_ACCESS_KEY=%s\n' "$CACHE_SECRET_ACCESS_KEY" >> "$GITHUB_ENV"
        printf 'CARGO_FLUX_S3_SESSION_TOKEN=%s\n' "$CACHE_SESSION_TOKEN" >> "$GITHUB_ENV"
        printf 'CARGO_FLUX_S3_REGION=%s\n' "$CACHE_REGION" >> "$GITHUB_ENV"

    - name: Install optional Rust toolchain
      if: inputs.toolchain != ''
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Install optional compiler cache
      if: inputs.compiler-cache == 'true'
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      with:
        version: v0.17.0
        disable_annotations: 'true'

    - name: Configure isolated compiler-cache daemon
      shell: bash
      env:
        COMPILER_CACHE: ${{ inputs.compiler-cache }}
        COMPILER_READ_ONLY: ${{ inputs.compiler-cache-read-only }}
        COMPILER_PREFIX: ${{ inputs.compiler-cache-prefix }}
      run: |
        set -euo pipefail
        case "$COMPILER_CACHE:$COMPILER_READ_ONLY" in true:true|true:false|false:true|false:false) ;; *) echo 'Compiler-cache flags must be true or false.' >&2; exit 1 ;; esac
        if [[ "$COMPILER_CACHE" == false ]]; then exit 0; fi
        for name in CARGO_FLUX_S3_ENDPOINT CARGO_FLUX_S3_BUCKET CARGO_FLUX_S3_ACCESS_KEY_ID CARGO_FLUX_S3_SECRET_ACCESS_KEY COMPILER_PREFIX; do
          value="${!name:-}"
          if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then echo "$name must be nonempty and single-line." >&2; exit 1; fi
        done
        export SCCACHE_BUCKET="$CARGO_FLUX_S3_BUCKET"
        export SCCACHE_ENDPOINT="$CARGO_FLUX_S3_ENDPOINT"
        export SCCACHE_REGION="${CARGO_FLUX_S3_REGION:-us-east-1}"
        export SCCACHE_S3_KEY_PREFIX="$COMPILER_PREFIX"
        export SCCACHE_BASEDIRS="$GITHUB_WORKSPACE"
        export SCCACHE_IGNORE_SERVER_IO_ERROR=1
        export SCCACHE_S3_USE_SSL=true
        case "$SCCACHE_ENDPOINT" in http://*) SCCACHE_S3_USE_SSL=false ;; https://*) ;; *) echo 'Invalid compiler-cache endpoint.' >&2; exit 1 ;; esac
        export SCCACHE_S3_RW_MODE=READ_WRITE
        if [[ "$COMPILER_READ_ONLY" == true ]]; then SCCACHE_S3_RW_MODE=READ_ONLY; fi
        export RUSTC_WRAPPER=sccache
        if [[ "$RUNNER_OS" != Windows ]]; then
          socket_dir="$(mktemp -d /tmp/flux-sccache.XXXXXX)"
          export SCCACHE_SERVER_UDS="$socket_dir/server.sock"
          printf 'SCCACHE_SERVER_UDS=%s\n' "$SCCACHE_SERVER_UDS" >> "$GITHUB_ENV"
        else
          export SCCACHE_SERVER_PORT="$(shuf -i 20000-60000 -n 1)"
          printf 'SCCACHE_SERVER_PORT=%s\n' "$SCCACHE_SERVER_PORT" >> "$GITHUB_ENV"
        fi
        # Only the daemon receives S3 credential aliases required by sccache.
        # Existing AWS_* values in subsequent workflow steps remain unchanged.
        AWS_ACCESS_KEY_ID="$CARGO_FLUX_S3_ACCESS_KEY_ID" \
        AWS_SECRET_ACCESS_KEY="$CARGO_FLUX_S3_SECRET_ACCESS_KEY" \
        AWS_SESSION_TOKEN="${CARGO_FLUX_S3_SESSION_TOKEN:-}" \
        AWS_EC2_METADATA_DISABLED=true \
        sccache --start-server
        sccache --zero-stats
        for name in SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_KEY_PREFIX SCCACHE_BASEDIRS SCCACHE_IGNORE_SERVER_IO_ERROR SCCACHE_S3_USE_SSL SCCACHE_S3_RW_MODE RUSTC_WRAPPER; do
          printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
        done
        echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"

    - name: Run Cargo Flux task
      id: run-unix
      if: inputs.task != '' && runner.os != 'Windows'
      shell: bash
      env:
        CARGO_FLUX: ${{ steps.install-unix.outputs.path }}
        TASK: ${{ inputs.task }}
        AFFECTED: ${{ inputs.affected }}
        CACHE_REQUIRED: ${{ inputs.cache-required }}
        WORKSPACE_ROOT: ${{ inputs.root }}
      run: |
        set -euo pipefail
        report="$(mktemp "${RUNNER_TEMP}/cargo-flux-report.XXXXXX")"
        args=(run "$TASK" --root "$WORKSPACE_ROOT" --report "$report")
        if [[ -n "$AFFECTED" ]]; then
          args+=(--affected "$AFFECTED")
        fi
        if [[ "$CACHE_REQUIRED" == true ]]; then args+=(--cache-required); fi
        "$CARGO_FLUX" "${args[@]}"
        "$CARGO_FLUX" report github-output --input "$report" --output-file "$GITHUB_OUTPUT"
        rm -f "$report"

    - name: Run Cargo Flux task
      id: run-windows
      if: inputs.task != '' && runner.os == 'Windows'
      shell: pwsh
      env:
        CARGO_FLUX: ${{ steps.install-windows.outputs.path }}
        TASK: ${{ inputs.task }}
        AFFECTED: ${{ inputs.affected }}
        CACHE_REQUIRED: ${{ inputs.cache-required }}
        WORKSPACE_ROOT: ${{ inputs.root }}
      run: |
        $ErrorActionPreference = 'Stop'
        $report = Join-Path $env:RUNNER_TEMP "cargo-flux-report-$([guid]::NewGuid()).json"
        $arguments = @('run', $env:TASK, '--root', $env:WORKSPACE_ROOT, '--report', $report)
        if (-not [string]::IsNullOrWhiteSpace($env:AFFECTED)) {
          $arguments += @('--affected', $env:AFFECTED)
        }
        if ($env:CACHE_REQUIRED -eq 'true') { $arguments += '--cache-required' }
        & $env:CARGO_FLUX @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & $env:CARGO_FLUX report github-output --input $report --output-file $env:GITHUB_OUTPUT
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Remove-Item -Force $report

branding:
  icon: git-branch
  color: purple
