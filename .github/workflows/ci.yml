name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ci-public-linux-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          components: clippy
          linux-dependencies: build
          cache-shared-key: check-v1
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

  windows-check:
    runs-on: ci-windows-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: ignition-is-go/pulse-actions/actions/setup-rust@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        with:
          targets: x86_64-pc-windows-msvc
          cache-shared-key: windows-check-v1
          windows-sparse-index: true
          compiler-cache-endpoint: ${{ secrets.CI_CACHE_ENDPOINT }}
          compiler-cache-bucket: ${{ secrets.CI_CACHE_BUCKET }}
          compiler-cache-access-key: ${{ secrets.CI_CACHE_ACCESS_KEY }}
          compiler-cache-secret-key: ${{ secrets.CI_CACHE_SECRET_KEY }}
      - name: Build the Windows release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - uses: ignition-is-go/pulse-actions/actions/report-resources@2c94ebf4fedd47f0c36d491e0dee5ad446a071b5 # v1.0.0
        if: always()

  release:
    needs: [check, windows-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ci-public-linux-ephemeral
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo install --path . --force
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Release
        id: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo flux version)
          if [ -z "$version" ]; then
            echo "No release-worthy commits; skipping release"
            exit 0
          fi
          cargo flux run release
          tag="v${version}"
          git rev-parse --verify "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-binaries:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ci-public-linux-ephemeral
            target: x86_64-unknown-linux-gnu
            binary_ext: ''
          - os: ci-macos-ephemeral
            target: x86_64-apple-darwin
            binary_ext: ''
          - os: ci-macos-ephemeral
            target: aarch64-apple-darwin
            binary_ext: ''
          - os: ci-windows-ephemeral
            target: x86_64-pc-windows-msvc
            binary_ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release binary
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          archive="cargo-flux-${VERSION}-${TARGET}.tgz"
          tar -C "target/${TARGET}/release" -czf "$archive" "cargo-flux${BINARY_EXT}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload release binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  verify-action:
    needs: [release, release-binaries]
    if: needs.release.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ci-public-linux-ephemeral
          - os: macos-intel
            runner: ci-macos-ephemeral
          - os: macos-arm
            runner: ci-macos-ephemeral
          - os: windows
            runner: ci-windows-ephemeral
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Create an output-composition fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-flux-action-smoke"
          cat > "$RUNNER_TEMP/cargo-flux-action-smoke/flux.toml" <<'EOF'
          [tasks.probe]
          root = ["git", "--version"]
          outputs = { version = "stdout" }

          [tasks.gated]
          depends_on = ["probe"]
          when = { output = "probe.version", nonempty = true }
          root = ["git", "--version"]
          EOF
      - name: Install and run the published binary through the action
        id: flux
        uses: ./
        with:
          version: ${{ needs.release.outputs.version }}
          root: ${{ runner.temp }}/cargo-flux-action-smoke
          task: gated
      - name: Verify Cargo Flux outputs and PATH
        shell: bash
        env:
          OUTCOME: ${{ steps.flux.outputs.outcome }}
          TASK_OUTPUTS: ${{ steps.flux.outputs['task-outputs'] }}
        run: |
          test "$OUTCOME" = completed
          grep -q '"probe":{"version":"git version ' <<< "$TASK_OUTPUTS"
          cargo-flux --help
